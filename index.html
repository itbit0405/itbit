<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITBIT | 잇빗 - 아이디어부터 양산까지, 통합 엔지니어링 파트너</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Brand Colors */
        .text-itbit-blue { color: #2E7BB8; }
        .bg-itbit-blue { background-color: #2E7BB8; }
        .bg-itbit-dark { background-color: #0B3D6A; }
        .border-itbit-blue { border-color: #2E7BB8; }
        
        /* Header glass effect */
        .glass-morphism {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .hero-gradient {
            background: linear-gradient(135deg, rgba(11, 61, 106, 0.92) 0%, rgba(46, 123, 184, 0.75) 100%);
        }

        /* Tech Card Detail */
        .tech-card {
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            filter: grayscale(100%);
            opacity: 0.6;
            background: #ffffff;
        }
        .tech-card:hover {
            filter: grayscale(0%);
            opacity: 1;
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        /* Custom Shapes */
        .hero-clip { clip-path: polygon(0 0, 100% 0, 100% 92%, 0% 100%); }
        
        .process-line::before {
            content: '';
            position: absolute;
            top: 2rem;
            bottom: 2rem;
            left: 1.7rem;
            width: 2px;
            background: rgba(46, 123, 184, 0.3);
            z-index: 0;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        .animate-slow-zoom {
            animation: slowZoom 20s infinite alternate;
        }
        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
